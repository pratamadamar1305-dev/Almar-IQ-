name: Deploy DOJO TARUNG + JedaSholat install

on:
  push:
    branches: [main, 'arena/3bddf50f-almar-iq']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Cek dulu apakah GitHub Pages sudah diaktifkan di repo ini.
  # Kalau belum, jangan gagal dengan error merah yang membingungkan —
  # tulis ringkasan berisi langkah perbaikannya.
  # ---------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sumber: ${{ steps.cek.outputs.sumber }}
    steps:
      - id: cek
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            let sumber = 'belum'
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo })
              sumber = data.build_type === 'workflow' ? 'workflow' : 'branch'
              core.info(`Pages aktif. build_type = ${data.build_type}, url = ${data.html_url || '-'}`)
            } catch (e) {
              if (e.status !== 404) throw e
              core.info('Pages belum diaktifkan (404).')
            }
            core.setOutput('sumber', sumber)

            const s = core.summary
            if (sumber === 'workflow') {
              await s.addHeading('✅ Pages siap — build & deploy jalan', 2).write()
            } else if (sumber === 'branch') {
              await s
                .addHeading('⚠️ Pages aktif tapi sumbernya "Deploy from a branch"', 2)
                .addRaw(
                  'Ubah ke **GitHub Actions** supaya workflow ini bisa deploy:\n\n' +
                  '`Settings → Pages → Build and deployment → Source: GitHub Actions`'
                )
                .write()
            } else {
              await s
                .addHeading('⚠️ GitHub Pages belum diaktifkan', 2)
                .addRaw(
                  'Aplikasinya sudah siap, tapi GitHub belum menyajikan apa pun di URL-nya ' +
                  '— makanya dibuka malah **404**.\n\n' +
                  '### Aktifkan (sekali saja, ±10 detik)\n' +
                  '1. Buka **Settings → Pages** pada repo ini\n' +
                  '2. Bagian **Build and deployment → Source**, pilih **GitHub Actions**\n' +
                  '3. Balik ke tab **Actions**, jalankan ulang workflow ini\n\n' +
                  'Setelah itu aplikasi live di: `https://' + owner + '.github.io/' + repo + '/`'
                )
                .write()
            }

  build:
    needs: preflight
    if: needs.preflight.outputs.sumber == 'workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      # dijalankan setelah build supaya uji subfolder ikut menguji dist asli
      - name: Test
        working-directory: app
        run: npm test

      - name: Add JedaSholat web installer
        if: ${{ hashFiles('install/index.html') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/dist/jedasholat
          cp install/index.html install/favicon.svg app/dist/jedasholat/
          gh release download jedasholat-debug --repo "$GITHUB_REPOSITORY" --pattern 'JedaSholat-debug.apk' --pattern 'JedaSholat-debug.apk.sha256' --dir app/dist/jedasholat --clobber
          test -s app/dist/jedasholat/JedaSholat-debug.apk
          test -s app/dist/jedasholat/JedaSholat-debug.apk.sha256

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: [preflight, build]
    if: needs.preflight.outputs.sumber == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Tampilkan URL
        run: |
          echo "🚀 Dojo Tarung: ${{ steps.deployment.outputs.page_url }}"
          echo "🕌 JedaSholat install: ${{ steps.deployment.outputs.page_url }}jedasholat/"
