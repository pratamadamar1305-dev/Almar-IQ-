name: Build JedaSholat Android
on:
  push:
    branches: ['arena/3bddf50f-almar-iq']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee test-build.log
      - name: Lint and debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app-build.log
      - name: Surface compiler diagnostics
        if: always()
        run: |
          mkdir -p app/build/reports core/build/reports
          cp -f test-build.log app-build.log app/build/reports/ || true
          python3 - <<'PY'
          from pathlib import Path
          for name in ('test-build.log', 'app-build.log'):
              p = Path(name)
              if p.exists():
                  for line in p.read_text(errors='replace').splitlines():
                      if any(token in line for token in ('e: file:', 'error:', 'FAILED', 'What went wrong', 'Execution failed', 'Error:', 'expected:', 'but was:')):
                          print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          import xml.etree.ElementTree as ET
          for p in Path('.').glob('*/build/test-results/*/TEST-*.xml'):
              for case in ET.parse(p).getroot().iter('testcase'):
                  for fail in case.iter('failure'):
                      print('::error::' + (case.get('name','') + ' ' + (fail.get('message','') + ' ' + (fail.text or '')).replace('%','%25').replace('\n','%0A'))
          for p in Path('.').glob('app/build/reports/lint-results-debug.txt'):
              for line in p.read_text(errors='replace').splitlines():
                  if 'Error:' in line: print('::error::' + line.replace('%','%25'))
          PY
      - uses: actions/upload-artifact@v5
        if: steps.build.outcome == 'success'
        with:
          name: JedaSholat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
      - name: Report build status
        if: always()
        run: |
          echo "tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
