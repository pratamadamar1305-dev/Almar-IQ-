name: Build JedaSholat Android
on:
  push:
    branches: ['arena/3bddf50f-almar-iq']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon
      - name: Lint and debug APK
        run: ./gradlew :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JedaSholat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
