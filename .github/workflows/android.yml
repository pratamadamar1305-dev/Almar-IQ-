name: Build JedaSholat Android
on:
  push:
    branches: ['arena/3bddf50f-almar-iq']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee test-build.log
      - name: Lint and debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app-build.log
      - name: Upload debug APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: JedaSholat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Surface compiler diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p app/build/reports core/build/reports
          cp -f test-build.log app-build.log app/build/reports/ || true
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('app/build/outputs/androidTest-results').glob('**/TEST-*.xml'):
              for case in ET.parse(p).getroot().iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      message = case.get('name', '') + ' ' + fail.get('message', '')
                      print('::error::TEST ' + message.replace('%', '%25').replace('\n', '%0A'))
          for name in ('install-testtarget.log', 'install-app.log', 'install-test.log', 'connected-test.log'):
              p = Path(name)
              if p.exists():
                  for line in p.read_text(errors='replace').splitlines():
                      if any(t in line for t in ('Success', 'Failure', 'INSTALL_', 'Tests run', 'OK (', 'FAILED', 'AssertionError', 'not bound', 'not enabled', 'Service', 'Process crashed', 'INSTRUMENTATION')):
                          print('::error::LINE ' + name + ' ' + line.replace('%', '%25').replace('\n', '%0A'))
          PY
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Android-emulator-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/connected-test.log
            android/install-testtarget.log
            android/install-app.log
            android/install-test.log
            android/logcat.txt
            android/window.xml
            android/accessibility-setting.txt
            android/accessibility-dump.txt
          if-no-files-found: warn
