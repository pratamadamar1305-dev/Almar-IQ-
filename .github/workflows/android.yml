name: Build JedaSholat Android
on:
  push:
    branches: ['arena/4b07b77a-almar-iq', 'arena/805bc1d8-almar-iq', 'arena/3bddf50f-almar-iq', 'arena/98d1c972-almar-iq', 'arena/0b4268c4-almar-iq', 'arena/150d314d-almar-iq', main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee test-build.log
      - name: Lint and debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:assembleDebug --no-daemon --console=plain 2>&1 | tee app-build.log
      - name: Upload debug APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: JedaSholat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Surface compiler diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p app/build/reports core/build/reports
          cp -f test-build.log app-build.log app/build/reports/ || true
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('build-test-apks.log', 'install-testtarget.log', 'install-app.log', 'install-test.log', 'connected-test.log'):
              p = Path(name)
              if p.exists():
                  lines = p.read_text(errors='replace').splitlines()
                  for line in lines[-120:]:
                      print('::error::TAIL ' + name + ' ' + line.replace('%', '%25').replace('\n', '%0A'))
                  for line in lines:
                      if any(t in line for t in ('e: file:', 'error:', 'FAILED', 'Exception', 'What went wrong', 'Execution failed', 'INSTALL_', 'Failure')):
                          print('::error::' + line.replace('%', '%25').replace('\n', '%0A'))
          for name in ('test-build.log', 'app-build.log'):
              p = Path(name)
              if p.exists():
                  for line in p.read_text(errors='replace').splitlines():
                      if any(token in line for token in ('e: file:', 'error:', 'FAILED', 'What went wrong', 'Execution failed', 'Error:')):
                          print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          for p in Path('.').glob('*/build/test-results/*/TEST-*.xml'):
              root = ET.parse(p).getroot()
              for case in root.iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      message = case.get('name', '') + ' ' + fail.get('message', '') + '\n' + (fail.text or '')
                      print('::error::' + message.replace('%', '%25').replace('\n', '%0A'))
              system = root.find('system-out')
              if system is not None and system.text:
                  print(system.text)
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
            android/app/build/test-results/
            android/core/build/test-results/
          if-no-files-found: warn
      - name: Report build status
        if: always()
        run: |
          echo "tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi

  ui:
    name: Native UI smoke + screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and UI test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee ui-build.log
      - name: Android 15 UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048
          heap-size: 256
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash -c 'set -uo pipefail; adb wait-for-device; adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk || exit 1; adb shell am instrument -w -e class id.jedasholat.app.UiSmokeTest id.jedasholat.app.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee ui-test.log; adb exec-out run-as id.jedasholat.app tar -cf - -C files ui-screenshots > ui-screenshots.tar || true; tar -xf ui-screenshots.tar || true; adb shell run-as id.jedasholat.app ls -l files/ui-screenshots > ui-screenshot-list.txt || true; if ! grep -q "OK (3 tests)" ui-test.log; then adb logcat -d > ui-logcat.txt || true; exit 1; fi'
      - name: Surface UI diagnostics
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, json, math, subprocess, sys
          p = Path('ui-test.log')
          if p.exists():
              for line in p.read_text(errors='replace').splitlines()[-40:]:
                  print('::error::UI ' + line.replace('%', '%25').replace('\n', '%0A'))
          p = Path('ui-screenshot-list.txt')
          if p.exists(): print('::error::SHOT_LIST ' + p.read_text(errors='replace').replace('%', '%25').replace('\n', '%0A'))
          p = Path('ui-logcat.txt')
          if p.exists():
              hits = [l for l in p.read_text(errors='replace').splitlines() if any(t in l for t in ('FATAL', 'AndroidRuntime', 'TestRunner', 'UiSmokeTest', 'AssertionError'))]
              for line in hits[-12:]:
                  print('::error::LOGCAT ' + line.replace('%', '%25').replace('\n', '%0A'))
          PY
      - name: Store native UI screenshots on the feature branch
        if: success() && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          for file in sorted(Path('ui-screenshots').glob('*.png')):
              target = f'docs/design/screenshots/{file.name}'
              api = f'repos/{repo}/contents/{target}'
              existing = subprocess.run(['gh', 'api', f'{api}?ref={branch}', '--jq', '.sha'], capture_output=True, text=True)
              payload = {'message': f'Update native UI screenshot {file.name} [skip ci]', 'branch': branch,
                         'content': base64.b64encode(file.read_bytes()).decode()}
              if existing.returncode == 0 and existing.stdout.strip():
                  payload['sha'] = existing.stdout.strip()
              Path('/tmp/ui-shot-payload.json').write_text(json.dumps(payload))
              subprocess.check_call(['gh', 'api', '-X', 'PUT', api, '--input', '/tmp/ui-shot-payload.json', '--jq', '.commit.sha'])
          PY
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: JedaSholat-UI-screenshots
          path: |
            android/ui-screenshots/
            android/ui-screenshot-list.txt
            android/ui-test.log
            android/ui-build.log
            android/ui-logcat.txt
          if-no-files-found: warn

  publish:
    name: Publish verified debug APK
    needs: [build, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: JedaSholat-debug
          path: dist
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=jedasholat-debug
          cp dist/app-debug.apk JedaSholat-debug.apk
          sha256sum JedaSholat-debug.apk > JedaSholat-debug.apk.sha256
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "JedaSholat Debug" --notes "APK debug untuk install langsung di Android. Bukan rilis Play Store." --prerelease
          fi
          gh release upload "$TAG" JedaSholat-debug.apk JedaSholat-debug.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "JedaSholat Debug 0.3.1" --notes "JedaSholat 0.3.1: status kesiapan perlindungan kini jujur per langkah (perlindungan, aplikasi terpilih, persetujuan, izin, layanan tersambung), tombol simulasi mati sampai benar-benar siap, diagnosis menyertakan readiness. Termasuk perbaikan 0.3.0: perbaikan alarm per sesi, pemulihan jadwal, pengingat persisten, sanitasi data lokal, pruning aplikasi, status snooze, dan UI beranda/jadwal yang lebih rapi. APK debug untuk Android 10+, bukan rilis Play Store. Verifikasi OEM tetap mengikuti docs/DEVICE_TEST_CHECKLIST.md."

  instrumented:
    # Advisory for the APK: this job never gates publishing (see `publish.needs`).
    # Contract: green = enforcement assertions passed, or the service never bound on this
    # emulator and every test self-skipped with a printed reason. Red = a real assertion or
    # install failure. Previously a brittle Settings-UI toggle made this permanently red,
    # which trained everyone to ignore the one job that actually exercises the overlay.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: |
          set -o pipefail
          ./gradlew :testtarget:assembleDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain 2>&1 | tee build-test-apks.log
      - name: Android 15 enforcement smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048
          heap-size: 256
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash -c 'set -o pipefail; pwd; adb wait-for-device; for apk in testtarget/build/outputs/apk/debug/testtarget-debug.apk app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do if ! adb install -r "$apk" > install-$(basename "$apk" .apk).log 2>&1; then echo "INSTALL_FAILED $apk"; cat install-$(basename "$apk" .apk).log; exit 1; fi; done; adb shell am instrument -w -e class id.jedasholat.app.EnforcementSmokeTest id.jedasholat.app.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee connected-test.log; adb logcat -d > logcat.txt || true; adb shell settings get secure enabled_accessibility_services > accessibility-setting.txt || true; adb shell dumpsys accessibility > accessibility-dump.txt || true; adb shell uiautomator dump /sdcard/jeda-window.xml || true; adb pull /sdcard/jeda-window.xml window.xml || true; if grep -q "^OK (" connected-test.log; then if grep -qE "AssumptionViolatedException|SKIP:" connected-test.log; then outcome=skipped-service-not-bound; else outcome=passed; fi; echo "INSTRUMENTED_OUTCOME=$outcome" | tee -a connected-test.log; exit 0; fi; echo "INSTRUMENTED_OUTCOME=failed" | tee -a connected-test.log; grep -E "^There (was|were)|Exception|Error|at id.jedasholat" connected-test.log | head -40 || true; exit 1'
      - name: Surface emulator diagnostics
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('app/build/outputs/androidTest-results').glob('**/TEST-*.xml'):
              for case in ET.parse(p).getroot().iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      message = case.get('name', '') + ' ' + fail.get('message', '')
                      print('::error::TEST ' + message.replace('%', '%25').replace('\n', '%0A'))
          executed = skipped = 0
          for p in list(Path('app/build/outputs/androidTest-results').glob('**/TEST-*.xml')) + list(Path('app/build/reports/androidTests').glob('**/TEST-*.xml')):
              for case in ET.parse(p).getroot().iter('testcase'):
                  if list(case.iter('skipped')): skipped += 1
                  else: executed += 1
          if executed + skipped == 0:
              connected = Path('connected-test.log')
              text = connected.read_text(errors='replace') if connected.exists() else ''
              started = sum(1 for l in text.splitlines() if l.startswith('INSTRUMENTATION_STATUS: test='))
              skipped = sum(1 for l in text.splitlines() if 'AssumptionViolatedException' in l)
              executed = max(started - skipped, 0)
          print(f'::notice::COUNTS executed_tests={executed} skipped_tests={skipped}')
          connected = Path('connected-test.log')
          log_text = connected.read_text(errors='replace') if connected.exists() else ''
          instrumented_ok = any(l.startswith('OK (') for l in log_text.splitlines())
          level = 'notice' if instrumented_ok else 'error'
          for line in log_text.splitlines():
              if line.startswith('INSTRUMENTED_OUTCOME') or line.startswith('SKIP:') or 'There was' in line \
                      or 'There were' in line or line.startswith('FAILURES') or 'Exception' in line \
                      or line.lstrip().startswith('at id.jedasholat'):
                  print(f'::{level}::RESULT ' + line.replace('%', '%25').replace('\n', '%0A'))
          # Gradle/install logs are only error-level when the run actually failed.
          for name in ('build-test-apks.log', 'install-testtarget.log', 'install-app.log', 'install-test.log'):
              p = Path(name)
              if p.exists():
                  for line in p.read_text(errors='replace').splitlines():
                      if any(t in line for t in ('e: file:', 'INSTALL_', 'FAILED', 'Process crashed', 'INSTRUMENTATION')):
                          print(f'::error::LINE ' + name + ' ' + line.replace('%', '%25').replace('\n', '%0A'))
          p = Path('accessibility-setting.txt')
          if p.exists(): print(f'::{level}::ACCESSIBILITY_SETTING=' + p.read_text(errors='replace').replace('\n', '%0A'))
          p = Path('accessibility-dump.txt')
          if p.exists():
              hits = [l for l in p.read_text(errors='replace').splitlines() if 'jedasholat' in l or 'Jeda' in l]
              for line in hits[:20]: print(f'::{level}::DUMPSYS ' + line.replace('%', '%25').replace('\n', '%0A'))
          p = Path('logcat.txt')
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  if ('jedasholat' in line and ('FATAL' in line or 'AndroidRuntime' in line or 'E/' in line)) or 'FATAL EXCEPTION' in line:
                      print(f'::{level}::LOGCAT ' + line.replace('%', '%25').replace('\n', '%0A'))
          PY
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Android-emulator-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/connected-test.log
            android/build-test-apks.log
            android/install-testtarget.log
            android/install-app.log
            android/install-test.log
            android/logcat.txt
            android/window.xml
            android/accessibility-setting.txt
            android/accessibility-dump.txt
          if-no-files-found: warn
