name: Build JedaSholat Android
on:
  push:
    branches: ['arena/3bddf50f-almar-iq']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon
      - name: Lint and debug APK
        id: build
        continue-on-error: true
        run: ./gradlew :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: JedaSholat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/

      - name: Report build status
        if: always()
        run: |
          echo "tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
