name: Test JedaSholat preview
on:
  push:
    paths: ['preview/**', '.github/workflows/jedasholat-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
